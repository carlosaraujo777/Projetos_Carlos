<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas | Carlos Alexandre</title>
    <!-- Link para o CSS que deixa o site bonito -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <header>
            <h1>🔐 Gerador de Senhas</h1>
            <p class="subtitle">Crie senhas fortes instantaneamente.</p>
        </header>

        <section style="text-align: center;">
            <!-- Caixa onde a senha vai aparecer -->
            <div id="resultado" class="senha-box">Sua senha aparecerá aqui</div>
            
            <!-- Botão que chama a função do JavaScript -->
            <button onclick="gerarSenha()" class="btn-gerar">Gerar Nova Senha</button>
            
            <br><br>
            
            <!-- Link para voltar -->
            <a href="index.html" style="color: #8b949e; text-decoration: none;">⬅ Voltar para o portfólio</a>
        </section>
    </div>

    <!-- Link para o JavaScript que faz a mágica acontecer -->
    <script src="script.js"></script>
</body>
</html>
