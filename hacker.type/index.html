        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- O fundo da chuva Matrix -->
    <canvas id="matrix-canvas"></canvas>

    <div class="terminal">
        <div id="output">
            <p>MATRIX OS v4.0.1 (c) 2026</p>
            <p>Type 'help' to see available commands.</p>
            <br>
        </div>
        
        <div class="input-line" id="input-line">
            <span class="prompt">root@matrix:~$</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
